<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Hindu Portal</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1B0B3B 0%, #2D1254 50%, #1B0B3B 100%);
      color: #EDE9FE;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #5B21B6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(91, 33, 182, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .logo img { width: 64px; height: 64px; object-fit: contain; }
    h1 { font-size: 22px; font-weight: 700; color: #FFFFFF; margin-bottom: 8px; }
    p { font-size: 14px; color: #A78BFA; line-height: 1.6; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(233, 185, 73, 0.15);
      border: 1px solid rgba(233, 185, 73, 0.3);
      color: #E9B949;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    button {
      background: #7C3AED;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #6D28D9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo.png" alt="Hindu Logo">
    </div>
    <div class="badge">Offline Mode</div>
    <h1>You're Currently Offline</h1>
    <p>Hindu Subscription Portal requires an active network connection for live synchronization. Previously cached data remains stored on your device.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
